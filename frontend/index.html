<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>감정·문화 저널</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-title">◐ 감정·문화</div>
        <nav>
            <a href="index.html" class="active">일기</a>
            <a href="archive.html">나의 기록</a>
            <a href="discovery.html">분석</a>
            <a href="repository.html">저장소</a>
        </nav>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Left Column: Input -->
        <div class="input-column">
            <h1 class="section-title">오늘의 일기 작성</h1>

            <div class="user-panel" data-user-panel>
                <span class="user-label">USER</span>
                <input class="user-input" data-user-input type="text" value="demo" aria-label="username">
                <button class="user-button" data-user-login type="button">LOAD</button>
                <span class="current-user" data-current-user>Demo User</span>
            </div>

            <!-- Daily Entry -->
            <div class="daily-entry-section">
                <textarea class="daily-entry-textarea" placeholder="오늘의 일기를 자유롭게 적어보세요. 이를 바탕으로 영화 음악 책을 추천해 드립니다."></textarea>
            </div>

            <!-- Multimodal Input -->
            <div class="multimodal-section">
                <div class="input-option" onclick="handleAudioOptionClick(event)">
                    <span class="input-option-label">01. 음성</span>
                    <span class="input-option-action" id="audioAction">녹음 시작</span>
                    <input type="file" id="audioInput" accept="audio/*">
                </div>
                <div class="input-option" onclick="document.getElementById('photoInput').click()">
                    <span class="input-option-label">02. 사진</span>
                    <span class="input-option-action">이미지 업로드</span>
                    <input type="file" id="photoInput" accept="image/*">
                </div>
                <div class="input-option" onclick="openDrawingPanel()">
                    <span class="input-option-label">03. 그림</span>
                    <span class="input-option-action">의미 그리기</span>
                </div>
                <div class="input-option" onclick="openLinkPanel()">
                    <span class="input-option-label">04. 링크</span>
                    <span class="input-option-action">외부 링크</span>
                </div>
            </div>

            <div class="drawing-panel" id="drawingPanel" hidden>
                <canvas id="drawingCanvas" width="360" height="180"></canvas>
                <div class="drawing-actions">
                    <button type="button" onclick="clearDrawing()">지우기</button>
                    <button type="button" onclick="submitDrawing()">그림 변환</button>
                </div>
            </div>

            <div class="link-panel" id="linkPanel" hidden>
                <input type="url" id="linkInput" class="link-input" placeholder="https://">
                <button type="button" onclick="submitLink()">링크 변환</button>
            </div>

            <div class="transcription-review" id="transcriptionReview" hidden>
                <div class="transcription-review-label">변환 텍스트 확인</div>
                <textarea id="transcriptionText" class="transcription-textarea" placeholder="업로드한 파일에서 변환된 텍스트를 확인하고 필요하면 수정하세요."></textarea>
            </div>
            <div class="api-status" id="apiStatus" aria-live="polite"></div>

            <!-- Analyze Button -->
            <button class="analyze-button" onclick="analyzeEmotion()">감정 분석</button>
        </div>

        <!-- Right Column: Recommendations -->
        <div class="recommendation-column">
            <!-- Filter Bar -->
            <div class="filter-bar">
                <select class="filter-dropdown">
                    <option>미디어 ▼</option>
                    <option>음악</option>
                    <option>영화</option>
                    <option>책</option>
                </select>
                <select class="filter-dropdown">
                    <option>관련성 ▼</option>
                    <option>높음</option>
                    <option>중간</option>
                    <option>낮음</option>
                </select>
                <select class="filter-dropdown">
                    <option>시대 ▼</option>
                    <option>최신</option>
                    <option>클래식</option>
                    <option>모든 시대</option>
                </select>
            </div>


            <!-- Recommendations List -->
            <div class="recommendations-list" id="recommendationsList">
                <!-- Recommendations will be populated here -->
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="js/session.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
